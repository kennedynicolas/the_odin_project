<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odin Links and Images</title>
</head>
<body>
    <h1>Homepage</h1>

    <a href="https://www.theodinproject.com/about"
    target="_blank"
    rel="noreferrer">Sobre The Odin Project</a>
    <!--

    <a> = tag de link

    href = especifica o endereço de destino de link

    target = especifica onde o link será aberto
        - _self, abre na aba atual (padrão)
        - _blank, abre em uma nova aba

    rel = descreve a relação entre a paǵina de destino e a página de origem
        - noopener = torna a nova página um processo completamente separado
        - noreferrer = esconde a URL de origem (de onde o usuário veio)

    links absolutos são links para páginas externas ao nosso site
    links relativos são links para outras páginas do nosso site
    -->

    <a href="./pages/about.html" target="_blank" rel="noreferrer">Sobre</a>
    <hr>
    <img src="./images/dog.jpg" alt="Foto de Charles de Luvio">
</body>
</html>
